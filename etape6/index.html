<!DOCTYPE html>
<html lang="fr">

<head>

    <!-- Encodage des caractères -->
    <meta charset="UTF-8">

    <!-- Titre de la page -->
    <title>Etape 6</title>

    <!-- Feuille de style -->
    <link rel="stylesheet" href="style.css">

    <!-- Slide 24 : chargement d'un fichier JavaScript externe -->
    <script src="script.js" defer></script>

</head>

<body>

    <!-- Conteneur principal -->
    <div id="table_container">

        <!-- Formulaire d'ajout -->
        <div id="form_container">

            <div class="form_group">

                <label class="form_label">
                    Nom:
                </label>

                <input type="text"
                       id="form_nom"
                       class="form_field"/>

            </div>

            <div class="form_group">

                <label class="form_label">
                    Prénom:
                </label>

                <input type="text"
                       id="form_prenom"
                       class="form_field"/>

            </div>

            <div class="form_group">

                <label class="form_label">
                    Points:
                </label>

                <input type="number"
                       id="form_points"
                       class="form_field"/>

            </div>

            <!-- Slide 129 : événement onclick -->
            <button class="btn-add"
                    onclick="doNewData()">

                Ajouter

            </button>

        </div>

        <!-- Tableau des personnes -->
        <table>

            <!-- En-tête du tableau -->
            <thead>

                <tr>
                    <th class="col_number">N°</th>
                    <th class="col_text">Nom</th>
                    <th class="col_text">Prénom</th>
                    <th class="col_number">Points</th>
                    <th class="col_chkbox">Select</th>
                </tr>

            </thead>

            <!-- Corps du tableau rempli par JavaScript -->
            <tbody id="table_body">

            </tbody>

        </table>

        <!-- Résumé -->
        <div id="container_summary">

            <p id="p1">0 ligne(s)</p>

            <p id="p2"></p>

            <p id="p3">
                Totale point(s)= 0
            </p>

        </div>

        <!-- Zone des boutons -->
        <div id="container_btn">

            <!-- Slide 129 : événement onclick -->
            <button class="btn-consol"
                    onclick="consoleTableau()">

                Console Tableau

            </button>

            <!-- Slide 129 : événement onclick -->
            <button class="btn-del"
                    onclick="deleteRow()">

                Supprimer

            </button>

        </div>

    </div>

</body>

</html>
