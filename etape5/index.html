<!-- Formulaire d'ajout -->
<div id="form_container">

    <div class="form_group">

        <label class="form_label">
            Nom:
        </label>

        <!-- Champ texte -->
        <input type="text"
               id="form_nom"
               class="form_field"/>
    </div>

    <div class="form_group">

        <label class="form_label">
            Prénom:
        </label>

        <!-- Champ texte -->
        <input type="text"
               id="form_prenom"
               class="form_field"/>
    </div>

    <div class="form_group">

        <label class="form_label">
            Points:
        </label>

        <!-- Champ numérique -->
        <input type="number"
               id="form_points"
               class="form_field"/>
    </div>

    <!-- Slide 129 : événement onclick -->
    <button class="btn-add"
            onclick="doNewData()">
        Ajouter
    </button>

</div>
